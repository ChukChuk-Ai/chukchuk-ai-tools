# 음성 도구의 고급 설정(기본값). 사용자가 고르는 값은 환경설정 > 도구 설정 > 음성(tool.json 의 settings)이 이 위에 얹힌다.
# 값은 AI Jarvis 의 음성 설정(원본 AI_Partner 에서 시험을 마친 값)에서 개인 값(호출어·목소리·낱말)을 빼고 옮겼다.
# 마이크·스피커는 따로 정하지 않는다: OS 기본 장치를 쓰고, 바뀌면 따라간다.

[stt]
# model 은 도구 설정(받아쓰기 모델)이 정한다. auto 면 GPU 가 있으면 gpu_model, 없으면 cpu_model
gpu_model = "large-v3-turbo"
cpu_model = "small"
gpu_compute_type = "int8"
cpu_compute_type = "int8"
beam_size = 1
use_prompt = true          # 캐릭터 이름·추가 호출어·프로그램 이름표(config/apps.toml)를 받아쓰기에 미리 알려 준다
prompt_extra = ""          # 더 알려 줄 낱말(쉼표로 구분). 많이 넣으면 엉뚱한 말이 섞일 수 있다
preview_model = "small"    # 말하는 동안 입력창 미리보기만 이 작은 모델로(본 모델이 다를 때만). 비우면 본 모델로

[tts]
# engines·edge_voice·windows_voice 는 도구 설정이 정한다
audio_stream = true        # edge 음성을 다 받기 전에 준비된 부분부터 재생
lead_in = 0.6              # 출력 시작 보호 구간(초). 첫 음절이 잘리지 않게. 0 이면 끔
lead_in_tone = 0.05        # 시작 신호(800Hz 0.08초)의 크기. 장치가 무음에서 깨어나지 않아 앞이 잘릴 때 필요하다. 0 이면 없음
lead_in_noise = 0.0

[tts.default_voices]
# Edge 목소리를 비워 두었을 때 화면 언어별 목소리
ko = "ko-KR-SunHiNeural"
en = "en-US-AriaNeural"
# 외국어 회화의 그 언어 목소리(Edge). 내장 음성은 그 언어의 첫 목소리
ja = "ja-JP-NanamiNeural"
zh = "zh-CN-XiaoxiaoNeural"
es = "es-ES-ElviraNeural"
fr = "fr-FR-DeniseNeural"
de = "de-DE-KatjaNeural"

[turn]
wait = 0.3                 # 말이 끝난 것 같을 때 이만큼 조용하면 끝으로 본다(초)
limit = 1.5                # 덜 끝난 것 같아도 이만큼 조용하면 끝으로 본다(초)
smart_turn = true          # 억양으로 말 끝을 판단하는 Smart Turn 모델(pipecat-ai/smart-turn-v3, BSD 2-Clause, 약 9MB)을 쓸지
resume_after = 0.3         # 말하기가 끝난 뒤 이만큼 지나서 다시 듣는다(초). 블루투스 스피커면 0.6
partial_min_seconds = 0.3
partial_interval_seconds = 0.2

[barge_in]
# enabled 는 도구 설정(끼어들기)이 정한다
phrases = ["그만", "멈춰", "중지", "스톱", "잠깐", "잠깐만", "stop", "wait", "hold on"]
pause_phrases = ["잠시만", "잠시만요", "잠깐", "잠깐만", "알았어", "그래 알았어", "오케이", "OK", "okay", "wait", "got it"]   # 말 전체가 이것일 때만 멈춘다
mode = "both"              # phrases = 멈춤 말만, level = 또렷한 목소리면 무슨 말이든 멈추고 이어 받아쓰기, both = 둘 다
level_margin_db = 15.0
level_hold_seconds = 0.26
level_window_seconds = 1.3
echo_gain_db = -22.0       # 스피커 소리가 마이크에 들어올 때 줄어드는 정도(dB). 너무 낮게 적으면 잘못 멈추고, 높게 적으면 목소리를 놓친다
loud_db = -4.0             # 말하는 동안 마이크가 이 크기(dBFS) 이상으로 이어지면 무슨 소리든 멈춘다. 0 이면 끔
loud_hold_seconds = 0.2

[resident]
# mic_always_on 은 도구 설정이 정한다. 일반모드는 받아쓰기라 호출어 값(wake_*·silence_timeout·character_name_*)은 쓰지 않는다.
# end_phrases 는 대화모드·회화를 끝내는 말, stop_commands 는 말하는 도중 멈추는 말로 쓴다
wake_partials = []         # 호출어의 일부만 들려도 호출로 볼 말(문장 맨 앞·끝)
end_phrases = ["대화 끝", "대화 끝내자", "대기해", "대기해 줘", "대기 모드", "대기 모드로", "that's all", "that is all", "stop listening", "go to sleep"]
stop_commands = ["그만", "그만해", "그만해줘", "그만해요", "그만 좀 해", "멈춰", "멈춰줘", "멈춰요", "멈춰 봐", "말 멈춰", "말 그만", "스톱", "중지",
                 "stop", "stop it", "stop talking", "be quiet", "that's enough"]
max_pending = 3            # 호출 대기 중 밀린 소리가 이보다 많으면 받아 적지 않고 버린다. 0 이면 끔
stale_seconds = 8.0        # 호출 대기 중 이보다 오래 기다린 소리는 버린다(초). 0 이면 끔
min_speech = 0.6           # 호출 대기 중 이보다 짧은 말소리("응", "어")는 받아 적지 않는다(초). 0 이면 끔
character_name_wake = true # 캐릭터 이름으로 부른다(문장 맨 앞)
character_name_end = true  # 캐릭터 이름을 문장 끝에서도 인정한다("…알려줘 ○○야"). 가족이 이름을 끝에 붙여 부르는 말이 오호출이 되면 끈다
